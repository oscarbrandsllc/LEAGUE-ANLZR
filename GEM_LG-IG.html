<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sleeper League KTC Infographic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #0D0E1B;
            color: #EAEBF0;
            overflow-x: hidden;
        }

        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: #0D0E1B;
        }

        .star {
            position: absolute;
            background-color: white;
            border-radius: 50%;
            animation: twinkle linear infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }

        .glass-panel {
            background: rgba(22, 24, 43, 0.5);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(128, 138, 189, 0.2);
            border-radius: 12px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        
        h1, h2, h3 {
            font-family: 'Orbitron', sans-serif;
            text-shadow: 0 0 5px rgba(118, 109, 255, 0.5), 0 0 10px rgba(66, 194, 255, 0.5);
        }
        
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }
        @media (min-width: 768px) {
            .chart-container {
                height: 450px;
            }
        }

        .rank-grid-item {
            transition: all 0.3s ease;
        }
        .rank-grid-item:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(118, 109, 255, 0.7);
        }

        .power-grid-row {
            border-bottom: 1px solid rgba(128, 138, 189, 0.1);
            padding: 0.5rem 0.25rem;
        }
        .power-grid-row:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="starfield"></div>

    <div class="max-w-7xl mx-auto space-y-8">
        <!-- Header -->
        <header class="text-center space-y-4">
            <h1 class="text-2xl md:text-3xl font-bold tracking-wider">Dynasty League Power Rankings</h1>
            <p class="text-lg text-gray-400">An infographic breakdown of your team's value using KTC metrics.</p>
        </header>

        <!-- Controls -->
        <div class="glass-panel p-4 flex flex-col md:flex-row items-center justify-center gap-4">
            <input type="text" id="usernameInput" placeholder="Enter Sleeper Username" class="bg-gray-900/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500 focus:ring-0 w-full md:w-auto">
            <select id="leagueSelect" class="hidden bg-gray-900/50 border border-gray-700 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-purple-500 focus:ring-0 w-full md:w-auto" disabled>
                <option>Select a league...</option>
            </select>
            <button id="fetchDataButton" class="bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-4 rounded-lg transition-colors w-full md:w-auto">Analyze League</button>
        </div>
        
        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center py-8">
            <p class="text-2xl animate-pulse">Analyzing cosmic data streams...</p>
        </div>

        <!-- Main Content -->
        <main id="infographicContent" class="hidden space-y-12">
            <!-- Summary Boxes -->
            <section id="summarySection" class="grid grid-cols-2 sm:grid-cols-4 gap-4"></section>

            <!-- Top Level Charts -->
            <section class="grid grid-cols-1 lg:grid-cols-2 gap-8">
                <div class="glass-panel p-6">
                    <h2 class="text-2xl text-center mb-4">Overall Team Value</h2>
                    <div class="chart-container">
                        <canvas id="overallValueChart"></canvas>
                    </div>
                </div>
                <div class="glass-panel p-6">
                    <h2 class="text-2xl text-center mb-4">Starting Lineup Value</h2>
                    <div class="chart-container">
                        <canvas id="startersValueChart"></canvas>
                    </div>
                </div>
            </section>

            <!-- Positional Comparison Radar -->
            <section class="glass-panel p-6">
                <h2 class="text-2xl text-center mb-4">Top 2 Positional Value vs League Avg</h2>
                <div class="chart-container">
                    <canvas id="positionalRadarChart"></canvas>
                </div>
            </section>

            <!-- Detailed Starter Rankings -->
            <section class="glass-panel p-4">
                <h2 class="text-xl text-center mb-4">Starting Position Power Grid</h2>
                <div id="starterRankingsGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    <!-- Grid items will be injected here by JavaScript -->
                </div>
            </section>
        </main>
    </div>

    <script>
        // --- Starfield Background ---
        const starfield = document.getElementById('starfield');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            const size = Math.random() * 3;
            star.style.width = `${size}px`;
            star.style.height = `${size}px`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.left = `${Math.random() * 100}%`;
            star.style.animationDuration = `${Math.random() * 3 + 2}s`;
            star.style.animationDelay = `${Math.random() * 3}s`;
            starfield.appendChild(star);
        }

        // --- DOM Elements ---
        const usernameInput = document.getElementById('usernameInput');
        const leagueSelect = document.getElementById('leagueSelect');
        const fetchDataButton = document.getElementById('fetchDataButton');
        const loadingIndicator = document.getElementById('loading');
        const infographicContent = document.getElementById('infographicContent');
        const starterRankingsGrid = document.getElementById('starterRankingsGrid');
        const summarySection = document.getElementById('summarySection');

        // --- Chart instances ---
        let overallChart, startersChart, radarChart;

        // --- State ---
        let state = {
            userId: null,
            leagues: [],
            players: {},
            oneQbData: {},
            sflxData: {},
            currentLeagueId: null,
            isSuperflex: false,
        };

        // --- Constants ---
        const API_BASE = 'https://api.sleeper.app/v1';
        const GOOGLE_SHEET_ID = '1MDTf1IouUIrm4qabQT9E5T0FsJhQtmaX55P32XK5c_0';
        const POS_COLORS = {
            QB: 'rgba(255, 58, 117, 0.8)',
            RB: 'rgba(0, 235, 199, 0.8)',
            WR: 'rgba(88, 167, 255, 0.8)',
            TE: 'rgba(180, 105, 255, 0.8)',
            FLEX: 'rgba(255, 127, 80, 0.8)', // Coral
            SUPER_FLEX: 'rgba(220, 220, 220, 0.8)', // Silver
            Picks: 'rgba(255, 199, 0, 0.8)'
        };


        // --- Event Listeners ---
        fetchDataButton.addEventListener('click', handleFetchData);

        // --- Main Logic ---
        async function handleFetchData() {
            const username = usernameInput.value.trim();
            if (!username) {
                alert('Please enter a Sleeper username.');
                return;
            }

            // Fetch leagues if username changed or no username stored
            if (!state.username || username.toLowerCase() !== state.username.toLowerCase()) {
                leagueSelect.classList.add('hidden');
                leagueSelect.disabled = true;
                setLoading(true);
                infographicContent.classList.add('hidden');
                try {
                    await fetchAndSetUser(username);
                    await fetchUserLeagues(state.userId);
                    populateLeagueSelect(state.leagues);
                    state.username = username;
                } catch (error) {
                    console.error('Error fetching leagues:', error);
                    alert(`An error occurred: ${error.message}`);
                } finally {
                    setLoading(false);
                }
                return; // wait for league selection
            }

            const leagueId = leagueSelect.value;
            if (!leagueId || leagueId === 'Select a league...') {
                alert('Please select a league to analyze.');
                return;
            }

            setLoading(true);
            infographicContent.classList.add('hidden');

            try {
                state.currentLeagueId = leagueId;
                if (Object.keys(state.players).length === 0) await fetchSleeperPlayers();
                if (Object.keys(state.oneQbData).length === 0) await fetchDataFromGoogleSheet();
                await analyzeLeague();
            } catch (error) {
                console.error('Error fetching data:', error);
                alert(`An error occurred: ${error.message}`);
            } finally {
                setLoading(false);
            }
        }

        function setLoading(isLoading) {
            loadingIndicator.classList.toggle('hidden', !isLoading);
            fetchDataButton.disabled = isLoading;
            fetchDataButton.textContent = isLoading ? 'Analyzing...' : 'Analyze League';
        }

        async function fetchAndSetUser(username) {
            const res = await fetch(`${API_BASE}/user/${username}`);
            if (!res.ok) throw new Error('Sleeper user not found.');
            const userData = await res.json();
            state.userId = userData.user_id;
        }

        async function fetchUserLeagues(userId) {
            const year = new Date().getFullYear();
            const res = await fetch(`${API_BASE}/user/${userId}/leagues/nfl/${year}`);
            if (!res.ok) throw new Error('Could not fetch leagues.');
            const leaguesData = await res.json();
            if (leaguesData.length === 0) throw new Error(`No leagues found for this user in ${year}.`);
            state.leagues = leaguesData.sort((a, b) => a.name.localeCompare(b.name));
        }

        function populateLeagueSelect(leagues) {
            leagueSelect.innerHTML = '<option>Select a league...</option>';
            leagues.forEach(l => {
                const opt = document.createElement('option');
                opt.value = l.league_id;
                opt.textContent = l.name;
                leagueSelect.appendChild(opt);
            });
            leagueSelect.disabled = false;
            leagueSelect.classList.remove('hidden');
        }
        
        async function fetchSleeperPlayers() {
             const res = await fetch(`${API_BASE}/players/nfl`);
             if (!res.ok) throw new Error('Could not fetch Sleeper players data.');
             state.players = await res.json();
        }
        
        async function fetchDataFromGoogleSheet() {
            const sheetNames = { oneQb: 'KTC_1QB', sflx: 'KTC_SFLX' };
            try {
                const [oneQbCsv, sflxCsv] = await Promise.all([
                    fetch(`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetNames.oneQb}`).then(res => res.text()),
                    fetch(`https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${sheetNames.sflx}`).then(res => res.text())
                ]);
                state.oneQbData = parseSheetData(oneQbCsv);
                state.sflxData = parseSheetData(sflxCsv);
            } catch (e) { 
                console.error("Fatal Error: Could not fetch data from Google Sheet.", e); 
                throw new Error("Could not retrieve KTC valuation data. Please try again later.");
            }
        }

        function parseSheetData(csvText) {
            const dataMap = {};
            const lines = csvText.split(/\r?\n/).slice(1);
            lines.forEach(line => {
                const columns = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g) || [];
                if (columns.length < 13) return;
                const clean = (str) => str ? str.replace(/"/g, '').trim() : '';
                const pos = clean(columns[2]);
                const sleeperId = clean(columns[12]);
                const ktcValue = parseInt(clean(columns[6]), 10);

                if (pos === 'RDP') {
                    const pickName = clean(columns[1]);
                    if (pickName) dataMap[pickName] = { ktc: ktcValue };
                } else if (sleeperId && sleeperId !== 'NA') {
                    dataMap[sleeperId] = { ktc: isNaN(ktcValue) ? 0 : ktcValue };
                }
            });
            return dataMap;
        }

        function getKtcValue(assetIdOrLabel) {
            if (!assetIdOrLabel) return 0;
            const dataSet = state.isSuperflex ? state.sflxData : state.oneQbData;
            return dataSet[assetIdOrLabel]?.ktc || 0;
        }

        async function analyzeLeague() {
            const leagueInfo = state.leagues.find(l => l.league_id === state.currentLeagueId);
            state.isSuperflex = (leagueInfo.roster_positions.includes('SUPER_FLEX') || leagueInfo.roster_positions.filter(p => p === 'QB').length > 1);

            const [rosters, users, tradedPicks] = await Promise.all([
                fetch(`${API_BASE}/league/${state.currentLeagueId}/rosters`).then(res => res.json()),
                fetch(`${API_BASE}/league/${state.currentLeagueId}/users`).then(res => res.json()),
                fetch(`${API_BASE}/league/${state.currentLeagueId}/traded_picks`).then(res => res.json()),
            ]);

            const teams = processLeagueData(rosters, users, tradedPicks, leagueInfo);
            const userTeam = teams.find(t => t.isUserTeam);
            const sortedStarters = [...teams].sort((a, b) =>
                Object.values(b.startersPositional).reduce((s,v)=>s+v,0) -
                Object.values(a.startersPositional).reduce((s,v)=>s+v,0)
            );

            infographicContent.classList.remove('hidden');
            renderCharts(teams, sortedStarters);
            renderRadarChart(userTeam, teams);
            renderStarterGrid(teams, leagueInfo);
            renderSummary(userTeam, teams, sortedStarters);
        }

        function processLeagueData(rosters, users, tradedPicks, leagueInfo) {
            const userMap = users.reduce((acc, user) => ({ ...acc, [user.user_id]: user }), {});
            
            return rosters.map(roster => {
                const owner = userMap[roster.owner_id];
                const teamName = owner?.display_name || `Team ${roster.roster_id}`;
                
                const overallPositional = { QB: 0, RB: 0, WR: 0, TE: 0, Picks: 0 };
                (roster.players || []).forEach(pId => {
                    const playerInfo = state.players[pId];
                    if (playerInfo && overallPositional.hasOwnProperty(playerInfo.position)) {
                        overallPositional[playerInfo.position] += getKtcValue(pId);
                    }
                });
                getOwnedPicks(roster.roster_id, tradedPicks, leagueInfo).forEach(p => {
                    overallPositional.Picks += getKtcValue(p.label);
                });

                const startersPositional = { QB: 0, RB: 0, WR: 0, TE: 0, FLEX: 0, 'SUPER_FLEX': 0 };
                const starterIds = roster.starters || [];
                const rosterPositions = leagueInfo.roster_positions;

                starterIds.forEach((pId, index) => {
                    const slot = rosterPositions[index];
                    // Check if the slot is one of the types we are tracking for the chart.
                    if (startersPositional.hasOwnProperty(slot)) {
                        startersPositional[slot] += getKtcValue(pId);
                    }
                });
                
                const totalValue = Object.values(overallPositional).reduce((a, b) => a + b, 0);

                return {
                    teamName,
                    totalValue,
                    overallPositional,
                    startersPositional,
                    roster,
                    isUserTeam: roster.owner_id === state.userId
                };
            }).sort((a,b) => b.totalValue - a.totalValue);
        }

        function getOwnedPicks(rosterId, tradedPicks, leagueInfo) {
            const defaultRounds = leagueInfo.settings.draft_rounds || 4;
            const leagueSeason = parseInt(leagueInfo.season);
            let ownedPicks = [];

            for (let i = 1; i <= 4; i++) {
                const season = leagueSeason + i;
                for (let round = 1; round <= defaultRounds; round++) {
                    ownedPicks.push({ season: String(season), round, original_owner_id: rosterId });
                }
            }

            tradedPicks.forEach(pick => {
                if (pick.roster_id === rosterId && pick.owner_id !== rosterId) {
                    const i = ownedPicks.findIndex(p => p.season === pick.season && p.round === pick.round && p.original_owner_id === rosterId);
                    if (i > -1) ownedPicks.splice(i, 1);
                }
                if (pick.owner_id === rosterId && pick.roster_id !== rosterId) {
                     if (parseInt(pick.season) > leagueSeason) {
                        ownedPicks.push({ season: pick.season, round: pick.round, original_owner_id: pick.roster_id });
                    }
                }
            });
            
            const ordinal = (n) => n + (n > 0 ? ['th', 'st', 'nd', 'rd'][(n > 3 && n < 21) || n % 10 > 3 ? 0 : n % 10] : '');
            return ownedPicks
                .sort((a, b) => a.season.localeCompare(b.season) || a.round - b.round)
                .map(p => ({ ...p, label: `${p.season} Mid ${ordinal(p.round)}` }));
        }
        
        function renderCharts(teams, sortedStarters) {
            const labels = teams.map(t => t.teamName);
            
            const chartOptions = (isOverall = false) => ({
                responsive: true,
                maintainAspectRatio: false,
                indexAxis: 'y',
                scales: {
                    x: { 
                        stacked: true, 
                        grid: { color: 'rgba(255, 255, 255, 0.1)', borderDash: [2, 4] }, 
                        ticks: { color: '#EAEBF0', font: { family: "'Roboto', sans-serif" } } 
                    },
                    y: { 
                        stacked: true, 
                        grid: { display: false }, 
                        ticks: { color: '#EAEBF0', font: { family: "'Roboto', sans-serif" } } 
                    }
                },
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: { color: '#EAEBF0', font: { family: "'Roboto', sans-serif" } }
                    },
                    tooltip: {
                        mode: 'index',
                        backgroundColor: 'rgba(13, 14, 27, 0.8)',
                        borderColor: 'rgba(128, 138, 189, 0.5)',
                        borderWidth: 1,
                        titleFont: { family: "'Orbitron', sans-serif" },
                        bodyFont: { family: "'Roboto', sans-serif" },
                        callbacks: {
                            label: (context) => ` ${context.dataset.label}: ${context.raw.toLocaleString()}`
                        }
                    }
                }
            });
            
            const createGradientBackground = (context, color) => {
                const chart = context.chart;
                const {ctx, chartArea} = chart;
                if (!chartArea) {
                    return color;
                }
                const gradient = ctx.createLinearGradient(0, chartArea.bottom, 0, chartArea.top);
                const baseColor = color.replace(', 0.8)', ')');
                gradient.addColorStop(0, baseColor.replace('rgba', 'rgba').replace(')', ', 0.2)'));
                gradient.addColorStop(1, baseColor.replace('rgba', 'rgba').replace(')', ', 0.8)'));
                return gradient;
            };

            // Overall Chart
            if (overallChart) overallChart.destroy();
            overallChart = new Chart(document.getElementById('overallValueChart'), {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'QB', data: teams.map(t => t.overallPositional.QB), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.QB) },
                        { label: 'RB', data: teams.map(t => t.overallPositional.RB), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.RB) },
                        { label: 'WR', data: teams.map(t => t.overallPositional.WR), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.WR) },
                        { label: 'TE', data: teams.map(t => t.overallPositional.TE), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.TE) },
                        { label: 'Picks', data: teams.map(t => t.overallPositional.Picks), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.Picks) },
                    ]
                },
                options: chartOptions(true)
            });

            // Starters Chart
            if (startersChart) startersChart.destroy();
            startersChart = new Chart(document.getElementById('startersValueChart'), {
                type: 'bar',
                data: {
                    labels: sortedStarters.map(t => t.teamName),
                    datasets: [
                        { label: 'QB', data: sortedStarters.map(t => t.startersPositional.QB), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.QB) },
                        { label: 'RB', data: sortedStarters.map(t => t.startersPositional.RB), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.RB) },
                        { label: 'WR', data: sortedStarters.map(t => t.startersPositional.WR), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.WR) },
                        { label: 'TE', data: sortedStarters.map(t => t.startersPositional.TE), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.TE) },
                        { label: 'FLEX', data: sortedStarters.map(t => t.startersPositional.FLEX), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.FLEX) },
                        { label: 'SUPER_FLEX', data: sortedStarters.map(t => t.startersPositional.SUPER_FLEX), backgroundColor: (context) => createGradientBackground(context, POS_COLORS.SUPER_FLEX) },
                    ]
                },
                options: chartOptions()
            });
        }

        function renderStarterGrid(teams, leagueInfo) {
            starterRankingsGrid.innerHTML = '';
            const rosterPositions = leagueInfo.roster_positions;

            const starterSlots = [];
            const positionCounts = {};
            rosterPositions.forEach(pos => {
                if (['QB', 'RB', 'WR', 'TE', 'FLEX', 'SUPER_FLEX'].includes(pos)) {
                    positionCounts[pos] = (positionCounts[pos] || 0) + 1;
                    starterSlots.push(`${pos}_${positionCounts[pos]}`);
                }
            });

            const teamStartersBySlot = {};
            teams.forEach(team => {
                const starters = team.roster.starters || [];
                const teamSlots = {};
                const posCounts = {};
                for(let i=0; i < starters.length; i++) {
                    const starterId = starters[i];
                    const slot = rosterPositions[i];
                    posCounts[slot] = (posCounts[slot] || 0) + 1;
                    const slotKey = `${slot}_${posCounts[slot]}`;
                    teamSlots[slotKey] = starterId;
                }
                teamStartersBySlot[team.teamName] = teamSlots;
            });

            starterSlots.forEach(slotKey => {
                const [slotPosition, slotIndex] = slotKey.split('_');
                const slotData = [];

                teams.forEach(team => {
                    const playerAtSlotId = teamStartersBySlot[team.teamName][slotKey];
                    const playerInfo = state.players[playerAtSlotId];
                    const ktcValue = getKtcValue(playerAtSlotId);
                    
                    slotData.push({
                        teamName: team.teamName,
                        playerName: playerInfo ? `${playerInfo.first_name} ${playerInfo.last_name}` : 'Empty Slot',
                        ktcValue: ktcValue,
                    });
                });

                slotData.sort((a, b) => b.ktcValue - a.ktcValue);

                const gridItem = document.createElement('div');
                gridItem.className = 'glass-panel p-3 rank-grid-item text-sm';

                let content = `<h3 class=\"text-lg font-bold text-center mb-2\">${slotPosition.replace('_', ' ')} ${slotIndex}</h3><ul>`;
                slotData.forEach((data, index) => {
                    const rank = index + 1;
                    const color = getRankColor(rank, teams.length);
                    content += `
                        <li class="flex justify-between items-center text-xs power-grid-row">
                            <div class="flex items-center w-2/3">
                                <span class="font-bold w-6 flex-shrink-0" style="color: ${color};">${rank}.</span>
                                <span class="truncate">${data.teamName}</span>
                            </div>
                            <div class="text-right w-1/3">
                                <span class="font-semibold" style="color: ${color};">${data.ktcValue.toLocaleString()}</span>
                                <p class="text-[10px] text-gray-400 truncate">${data.playerName}</p>
                            </div>
                        </li>
                    `;
                });
                content += '</ul>';
                gridItem.innerHTML = content;
                starterRankingsGrid.appendChild(gridItem);
            });
        }

        function renderSummary(userTeam, teams, sortedStarters) {
            const overallRank = teams.findIndex(t => t.isUserTeam) + 1;
            const startersRank = sortedStarters.findIndex(t => t.isUserTeam) + 1;
            const topPlayerId = (userTeam.roster.players || [])
                .map(id => ({ id, val: getKtcValue(id) }))
                .sort((a,b) => b.val - a.val)[0]?.id;
            const topInfo = state.players[topPlayerId] || {};
            const topName = topInfo.first_name ? `${topInfo.first_name} ${topInfo.last_name}` : 'N/A';
            const topVal = getKtcValue(topPlayerId);

            const boxes = [
                { label: 'Overall Rank', value: `#${overallRank}` },
                { label: 'Total KTC', value: userTeam.totalValue.toLocaleString() },
                { label: 'Starters Rank', value: `#${startersRank}` },
                { label: 'Top Player', value: `${topName} (${topVal.toLocaleString()})` }
            ];

            summarySection.innerHTML = boxes.map(b => `
                <div class="glass-panel p-4 text-center">
                    <p class="text-xs text-gray-400">${b.label}</p>
                    <p class="text-lg font-bold">${b.value}</p>
                </div>
            `).join('');
        }

        function getTopTwoPositionalValues(team) {
            const positions = ['QB','RB','WR','TE'];
            const result = { QB:0, RB:0, WR:0, TE:0 };
            positions.forEach(pos => {
                const players = (team.roster.players || []).filter(id => state.players[id]?.position === pos);
                const topTwo = players.map(id => getKtcValue(id)).sort((a,b)=>b-a).slice(0,2);
                result[pos] = topTwo.reduce((s,v)=>s+v,0);
            });
            return result;
        }

        function renderRadarChart(userTeam, teams) {
            const userPos = getTopTwoPositionalValues(userTeam);
            const avg = { QB:0, RB:0, WR:0, TE:0 };
            teams.forEach(t => {
                const vals = getTopTwoPositionalValues(t);
                Object.keys(avg).forEach(k => avg[k] += vals[k]);
            });
            Object.keys(avg).forEach(k => avg[k] = avg[k] / teams.length);

            if (radarChart) radarChart.destroy();
            radarChart = new Chart(document.getElementById('positionalRadarChart'), {
                type: 'radar',
                data: {
                    labels: ['QB','RB','WR','TE'],
                    datasets: [
                        {
                            label: 'Your Team',
                            data: [userPos.QB, userPos.RB, userPos.WR, userPos.TE],
                            backgroundColor: 'rgba(180,105,255,0.2)',
                            borderColor: 'rgba(180,105,255,1)'
                        },
                        {
                            label: 'League Avg',
                            data: [avg.QB, avg.RB, avg.WR, avg.TE],
                            backgroundColor: 'rgba(0,235,199,0.2)',
                            borderColor: 'rgba(0,235,199,1)'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { labels: { color: '#EAEBF0' } }
                    },
                    scales: {
                        r: {
                            angleLines: { color: 'rgba(255,255,255,0.1)' },
                            grid: { color: 'rgba(255,255,255,0.1)' },
                            pointLabels: { color: '#EAEBF0' },
                            ticks: { display: false }
                        }
                    }
                }
            });
        }
        
        function getRankColor(rank, total) {
            const percentage = (total - rank + 1) / total;
            if (percentage > 0.8) return '#00EBC7'; // Elite
            if (percentage > 0.6) return '#58A7FF'; // Great
            if (percentage > 0.4) return '#EAEBF0'; // Average
            if (percentage > 0.2) return '#B469FF'; // Below Average
            return '#FF3A75'; // Poor
        }


    </script>
</body>
</html>
